name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libgphoto2 + libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libgphoto2-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  msrv:
    name: MSRV (Rust 1.82, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["--all-features", "--no-default-features"]
    steps:
      - uses: actions/checkout@v4
      - name: Install libgphoto2 + libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libgphoto2-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked ${{ matrix.features }}

  docs:
    name: docs.rs (${{ matrix.features || 'default features' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--all-features", "--no-default-features"]
    env:
      DOCS_RS: "1"
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No native libgphoto2 or libclang install: documentation must build
      # entirely against the committed bindings, regardless of features.
      - run: cargo doc --workspace --no-deps --locked ${{ matrix.features }}

  package:
    name: package verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libgphoto2 + libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libgphoto2-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build packaged crates and verify archive contents
        run: bash ./scripts/check-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: crate-release-candidate
          path: target/package-check/package/*.crate
          if-no-files-found: error

  # Full suite (incl. the Directory-Browse virtual-camera integration tests,
  # which need the `directory` camlib + `disk` iolib shipped on these platforms).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install libgphoto2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgphoto2-dev pkg-config clang libclang-dev
      - name: Install libgphoto2 (macOS)
        if: runner.os == 'macOS'
        run: brew install libgphoto2 pkgconf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (default features = build-time bindgen)
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Test (log feature)
        run: cargo test -p gphoto2-bindings --features log
      - name: Doc tests
        run: cargo test --workspace --doc
      - name: Test (committed bindings)
        run: cargo test --workspace --all-targets --no-default-features
      - name: Verify docs.rs environment transitions
        run: |
          DOCS_RS=1 cargo doc --workspace --no-deps --all-features
          cargo test --workspace --lib --all-features

  # Use matching UCRT64 packages for Rust, the linker, and libgphoto2. These
  # must share a C runtime because the wrapper frees allocations from the DLL.
  # MSYS2 no longer packages libgphoto2 for the older MINGW64 environment.
  # Virtual-camera integration tests continue to run on Linux/macOS above.
  windows:
    name: test (windows / ucrt64)
    runs-on: windows-latest
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-libgphoto2
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
      - name: Verify UCRT64 toolchain and versions
        run: |
          test "$MSYSTEM" = UCRT64
          [[ "$(command -v cargo)" == /ucrt64/bin/* ]]
          [[ "$(command -v rustc)" == /ucrt64/bin/* ]]
          [[ "$(command -v gcc)" == /ucrt64/bin/* ]]
          cargo --version
          rustc -vV
          pkg-config --modversion libgphoto2
          objdump -p /ucrt64/bin/libgphoto2-6.dll | grep 'DLL Name:'
      - name: Build (committed bindings; no libclang needed)
        run: cargo build --workspace --all-targets --no-default-features --features log --locked
      - name: Unit tests
        run: cargo test --workspace --lib --no-default-features --features log --locked
      - name: Logging integration tests
        run: cargo test -p gphoto2-bindings --test logging --no-default-features --features log --locked

  # Build libgphoto2 from the vendored source with its virtual PTP camera
  # (--enable-vusb + ptp2) and run the vcamera tests against it. This is the only
  # way to cover capture / config tree / events without real hardware.
  vcamera:
    name: vcamera (virtual PTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libltdl-dev pkg-config gettext clang libclang-dev
          # apt's meson is too old for libgphoto2 (needs >= 1.4.0); use pipx.
          pipx install meson
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build vusb libgphoto2 + run vcamera tests
        run: ./scripts/run-vcamera-tests.sh

  # Run Miri (Stacked Borrows) over the pure-unsafe code — callback trampolines,
  # event-data malloc/free, string marshalling, ABI guards. Tests that call into
  # libgphoto2 are excluded via cfg(miri), since Miri can't execute FFI.
  miri:
    name: miri (unsafe paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libgphoto2 + libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libgphoto2-dev pkg-config clang libclang-dev
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri test --workspace --lib --all-features

  # AddressSanitizer over the real C boundary: build libgphoto2 (vusb+ptp2) with
  # ASan and run the vcamera tests instrumented, catching out-of-bounds / UAF in
  # our marshalling or in libgphoto2 itself during real capture/config/events.
  asan:
    name: asan (vcamera, runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libltdl-dev pkg-config gettext clang libclang-dev llvm
          pipx install meson
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Build ASan libgphoto2 + run vcamera tests under ASan
        run: ./scripts/run-vcamera-asan.sh
