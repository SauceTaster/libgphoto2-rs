[package]
name = "gphoto2-bindings"
version = "0.1.0"
description = "Safe, idiomatic Rust bindings to libgphoto2: detect, capture, download and inspect digital cameras"
keywords = ["gphoto2", "camera", "ptp", "photography", "usb"]
categories = ["api-bindings", "hardware-support", "multimedia"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Keep source imports compatible with existing Git dependency users.
[lib]
name = "gphoto2"

[features]
# Forwarded to gphoto2-sys: regenerate FFI bindings at build time (default) vs.
# use the committed pregenerated bindings (`--no-default-features`).
default = ["buildtime-bindgen"]
buildtime-bindgen = ["gphoto2-sys/buildtime-bindgen"]
# Bridge libgphoto2's internal logging to the `log` crate (see `log_bridge`).
log = ["dep:log"]

[dependencies]
gphoto2-sys = { workspace = true, default-features = false }
log = { version = "0.4", optional = true }

[package.metadata.docs.rs]
no-default-features = true
features = ["log"]

[[example]]
name = "detect"
path = "examples/detect.rs"

[[example]]
name = "config"
path = "examples/config.rs"

[[example]]
name = "tether"
path = "examples/tether.rs"

[[example]]
name = "threaded"
path = "examples/threaded.rs"
